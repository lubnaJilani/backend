
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="posts.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Platform</title>
</head>
<body>

    <h1>Announcement Platform</h1>

    <form id="postForm">
        <label for="title">Title:</label>
        <input type="text" id="title" required>
        <br><br>

        <label for="content">Content:</label>
        <textarea id="content" required></textarea>
        <br><br>

        <label for="userId">User ID:</label>
        <input type="number" id="userId" min="1" required>
        <br><br>

        <button type="submit">Create Post (POST)</button>
    </form>

    <hr>

    <button id="putBtn" type="button">Replace Post (PUT)</button>
    <button id="patchBtn" type="button">Update Title (PATCH)</button>
    <button id="deleteBtn" type="button">Delete Post</button>

    <h2>API Response</h2>
    <pre id="output">Response will appear here.</pre>

  




    <script src="posts.js"></script>
</body>
</html>
